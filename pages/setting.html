<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pengaturan | Perpa Smart Lock</title>

  <!-- Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS (ganti path jika perlu) -->
  <link rel="stylesheet" href="../css/setting.css">
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="logo-wrap">
          <!-- placeholder logo (gantikan dengan file/logo Anda) -->
          <div class="logo-sticker">P</div>
          <div class="logo-text">
            <div class="brand">Perpa</div>
            <div class="sub">Smart Lock</div>
          </div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item" href="#"><span class="nav-ico">🏠</span> Dashboard</a>
        <a class="nav-item" href="#"><span class="nav-ico">🕒</span> Riwayat Akses</a>
        <a class="nav-item" href="#"><span class="nav-ico">👥</span> Kelola Pengguna</a>
        <a class="nav-item active" href="#"><span class="nav-ico">⚙️</span> Pengaturan</a>
      </nav>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <!-- TOPBAR -->
      <header class="topbar">
        <button id="menu-btn" class="hamburger" aria-label="Toggle sidebar">☰</button>
        <div class="topbar-search">
          <input id="search" type="text" placeholder="Cari..." />
        </div>
        <div class="topbar-right">
          <button class="icon-btn" title="Notifikasi">🔔</button>
          <button class="icon-btn" title="Profil">👤</button>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="content">
        <section class="card settings-card">
          <h2 class="card-title">Hubungkan Website dengan Telegram</h2>

          <label class="field-label">Token bot Telegram</label>
          <input id="token" class="field-input" type="text" placeholder="Masukkan Token" />

          <label class="field-label">Chat ID</label>
          <input id="chatid" class="field-input" type="text" placeholder="Masukkan Chat ID" />

          <label class="field-label">Jam Operasional Notifikasi</label>
          <div class="time-picker-row">
            <div class="time-input-wrapper">
              <div class="input-with-ico">
                <input id="start-time" class="time-input" type="text" placeholder="Pilih Waktu Mulai" autocomplete="off" />
                <button class="chev-btn" aria-hidden="true" data-target="start-time" title="Buka picker">
                  <svg class="chev" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" /></svg>
                </button>
              </div>
            </div>

            <div class="time-input-wrapper">
              <div class="input-with-ico">
                <input id="end-time" class="time-input" type="text" placeholder="Pilih Waktu Berakhir" autocomplete="off" />
                <button class="chev-btn" aria-hidden="true" data-target="end-time" title="Buka picker">
                  <svg class="chev" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" /></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- actions: left (Batal,Simpan) & right (Sinkronisasi) -->
          <div class="card-actions">
            <div class="actions-left">
              <button id="btn-cancel" class="btn btn-ghost">Batal</button>
              <button id="btn-save" class="btn btn-primary">Simpan</button>
            </div>
            <div class="actions-right">
              <button id="btn-sync" class="btn btn-primary outlined">Sinkronisasi Perangkat</button>
            </div>
          </div>
        </section>

        <section class="card duration-card">
          <label class="field-label">Durasi Kunci Pintu Terbuka</label>
          <div class="duration-row">
            <input id="duration" class="duration-input" type="number" min="1" value="5" />
            <div class="duration-label">Menit</div>
          </div>

          <div class="duration-actions">
            <button id="btn-restart" class="btn btn-danger">Restart Perangkat</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- JS -->
  <script src="../js/setting.js"></script>
</body>
</html>
