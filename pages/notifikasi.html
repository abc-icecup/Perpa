<!DOCTYPE html>
<html lang="id">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<body class="app-body">

    <!-- ========== HEADER ========== -->
    <header class="app-header">
        <div class="header-left">
            <button id="menu-btn" class="icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />

            <div class="brand">

                    <p class="brand-sub">Smart Lock</p>
                </div>
            </div>
        </div>

        <div class="header-right">
            <button class="icon-btn notif-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 17h5l-1.405-1.405M19 13v-1a8 8 0 10-16 0v1m12 4v1a3 3 0 11-6 0v-1" />
                </svg>
                <span class="notif-dot"></span>
            </button>

            <div class="profile-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5.121 17.804A9 9 0 1112 21v-9" />
                </svg>
            </div>
        </div>

    <!-- ========== SIDEBAR ========== -->
    <aside id="sidebar" class="sidebar">
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">🏠 Dashboard</a>
            <a href="#" class="nav-item">🕓 Riwayat Akses</a>
            <a href="#" class="nav-item">👤 Kelola Pengguna</a>
            <a href="#" class="nav-item">⚙ Pengaturan</a>
        </nav>
    </aside>

    <div id="overlay" class="overlay"></div>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main-content">
        <h2>Notifikasi Akses Pintu Rumah Aman</h2>

        <!-- Template Notifikasi -->

        <div id="notifContainer"></div>
